[lib]
proc-macro = true

[features]
preprocess = []

[dependencies]
aeris-ui-lib = { workspace = true }
proc-macro2  = { workspace = true }
quote        = { workspace = true }
sha2         = { workspace = true }
syn          = { workspace = true, features = ["extra-traits"] }
wincode      = { workspace = true, features = ["derive"] }
