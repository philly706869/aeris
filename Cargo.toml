[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/core/ui",
  "crates/core/ui/lib",
  "crates/core/ui/proc",
  "crates/synx",
  "crates/std",
  "crates/std/ui",
  "apps/cli",
  "apps/daemon",
  "examples/json",
]

[workspace.package]
version = "0.0.0-prenext.1"
edition = "2024"
publish = false

[workspace.dependencies]
aeris              = { path = "crates/core" }
aeris-ui           = { path = "crates/core/ui" }
aeris-ui-lib       = { path = "crates/core/ui/lib" }
aeris-ui-proc      = { path = "crates/core/ui/proc" }
synx               = { path = "crates/synx" }
aeris-std          = { path = "crates/std" }
aeris-std-ui       = { path = "crates/std/ui" }
aeris-cli          = { path = "apps/cli" }
aeris-daemon       = { path = "apps/daemon" }
example-json       = { path = "examples/json" }
clap               = { version = "4" }
criterion          = { version = "0.8" }
fnv                = { version = "1" }
inkwell            = { version = "0.10", features = ["llvm22-1-force-static"] }
postcard           = { version = "1" }
proc-macro2        = { version = "1" }
quote              = { version = "1" }
rayon              = { version = "1" }
rustc-hash         = { version = "2" }
serde              = { version = "1" }
syn                = { version = "3" }
tokio              = { version = "1" }
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
