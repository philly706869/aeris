[workspace]
resolver = "3"
members = [
  "core",
  "core/ui",
  "core/ui/lib",
  "core/ui/macro",
  "std/core",
  "std/core/ui",
  "std/core/ui/cluster",
  "std/cli",
  "std/daemon",
  "proto/json",
  "proto/json/cluster",
]

[workspace.package]
version = "0.0.0-prenext.1"
edition = "2024"
publish = false

[workspace.dependencies]
aeris                = { path = "core" }
aeris-ui             = { path = "core/ui" }
aeris-ui-lib         = { path = "core/ui/lib" }
aeris-ui-macro       = { path = "core/ui/macro" }
aeris-std            = { path = "std/core" }
aeris-std-ui         = { path = "std/core/ui" }
aeris-std-ui-cluster = { path = "std/core/ui/cluster" }
aeris-cli            = { path = "std/cli" }
aeris-daemon         = { path = "std/daemon" }
proto-json           = { path = "proto/json" }
proto-json-cluster   = { path = "proto/json/cluster" }
clap                 = { version = "4", features = ["derive"] }
inkwell              = { version = "0.9", features = ["llvm22-1-force-static"] }
proc-macro2          = { version = "1" }
quote                = { version = "1" }
rayon                = { version = "1" }
sha2                 = { version = "0.11" }
syn                  = { version = "2" }
tokio                = { version = "1", features = ["full"] }
tracing              = { version = "0.1" }
wincode              = { version = "0.5" }
