[workspace]
resolver = "3"
members = [
  # AERIS
  "core",

  # AERIS Standard
  "standard/core",
  "standard/constants",
  "standard/language-server",
  "standard/cli",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
aeris           = { path = "core" }
aeris-standard  = { path = "standard/core" }
aeris-constants = { path = "standard/constants" }
anyhow          = { version = "1.0" }
clap            = { version = "4.5", features = ["derive"] }
icu_properties  = { version = "2.1" }
indexmap        = { version = "2.12" }
inkwell         = { version = "0.7", features = ["llvm21-1"] }
rayon           = { version = "1.11" }
tokio           = { version = "1.48", features = ["full"] }
uuid            = { version = "1.18", features = ["v4"] }
