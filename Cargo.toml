[workspace]
resolver = "3"
members = [
  "core",
  "core/ui",
  "core/ui/lib",
  "core/ui/macro",
  "core/ui/preprocessor",
  "std/core",
  "std/core/ui",
  "std/core/ui/shard",
  "std/core/ui/preprocessor",
  "std/cli",
  "std/daemon",
]

[workspace.package]
version = "0.0.0-prenext.1"
edition = "2024"
publish = false

[workspace.dependencies]
aeris                 = { path = "core" }
aeris-ui              = { path = "core/ui" }
aeris-ui-lib          = { path = "core/ui/lib" }
aeris-ui-macro        = { path = "core/ui/macro" }
aeris-ui-preprocessor = { path = "core/ui/preprocessor" }
aeris-std             = { path = "std/core" }
aeris-std-ui          = { path = "std/core/ui" }
aeris-std-ui-shard    = { path = "std/core/ui/shard" }
clap                  = { version = "4", features = ["derive"] }
inkwell               = { version = "0.9", features = ["llvm22-1-force-static"] }
quote                 = { version = "1" }
rayon                 = { version = "1" }
rkyv                  = { version = "0.8" }
syn                   = { version = "2" }
tokio                 = { version = "1", features = ["full"] }
