[workspace]
resolver = "3"
members = [
  # AERIS
  "core",
  "core/ui",
  "core/ui/lib",
  "core/ui/macro",
  "core/code",

  # AERIS Standard
  "standard/core",
  "standard/core/ui",
  "standard/core/code",
  "standard/ui-server",
  "standard/cli",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
aeris               = { path = "core" }
aeris-ui            = { path = "core/ui" }
aeris-ui-lib        = { path = "core/ui/lib" }
aeris-ui-macro      = { path = "core/ui/macro" }
aeris-code          = { path = "core/code" }
aeris-standard      = { path = "standard/core" }
aeris-standard-ui   = { path = "standard/core/ui" }
aeris-standard-code = { path = "standard/core/code" }
anyhow              = { version = "1.0" }
clap                = { version = "4.5", features = ["derive"] }
icu_properties      = { version = "2.1" }
indexmap            = { version = "2.12" }
inkwell             = { version = "0.7", features = ["llvm21-1"] }
proc-macro2         = { version = "1.0" }
quote               = { version = "1.0" }
rayon               = { version = "1.11" }
tokio               = { version = "1.48", features = ["full"] }
uuid                = { version = "1.18", features = ["v4"] }
