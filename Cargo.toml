[workspace]
resolver = "3"
members = [
  # Lib
  "core",
  "core/ui",
  "core/ui/lib",
  "core/ui/macro",

  # Bin
  "cli",
  "daemon",
]

[workspace.package]
version = "0.0.0-prenext.1"
edition = "2024"
publish = false

[workspace.dependencies]
aeris          = { path = "core" }
aeris-ui       = { path = "core/ui" }
aeris-ui-lib   = { path = "core/ui/lib" }
aeris-ui-macro = { path = "core/ui/macro" }
clap           = { version = "4", features = ["derive"] }
inkwell        = { version = "0.9", features = ["llvm22-1-force-static"] }
quote          = { version = "1" }
rayon          = { version = "1" }
syn            = { version = "2" }
tokio          = { version = "1", features = ["full"] }
